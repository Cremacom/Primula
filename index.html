<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primula Gestionale — Impresa di Pulizia</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- ========== SCHERMATA LOGIN ========== -->
    <div class="login-screen" id="loginScreen">
        <div class="login-card">
            <div class="login-header">
                <span class="login-logo">&#9752;</span>
                <h1 class="login-title">Primula</h1>
                <p class="login-subtitle">Gestionale Impresa di Pulizia</p>
            </div>
            <form id="loginForm" autocomplete="off">
                <div class="login-field">
                    <label for="loginUsername">Username</label>
                    <input type="text" id="loginUsername" placeholder="Inserisci username" autocomplete="username" required>
                </div>
                <div class="login-field">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="Inserisci password" autocomplete="current-password" required>
                </div>
                <div class="login-error" id="loginError"></div>
                <button type="submit" class="login-btn">Accedi</button>
            </form>
            <p class="login-hint">Primo accesso: <strong>admin</strong> / <strong>admin</strong></p>
        </div>
    </div>

    <!-- ========== APP SHELL (nascosto finche' non autenticati) ========== -->
    <div id="appShell" style="display:none;">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <span class="logo-icon">&#9752;</span>
                <span class="logo-text">Primula</span>
            </div>
            <button class="sidebar-close" id="sidebarClose" aria-label="Chiudi menu">&times;</button>
        </div>
        <nav class="sidebar-nav">
            <a href="#" class="nav-item active" data-page="dashboard">
                <span class="nav-icon">&#9635;</span>
                <span class="nav-label">Dashboard</span>
            </a>
            <a href="#" class="nav-item" data-page="clienti">
                <span class="nav-icon">&#9823;</span>
                <span class="nav-label">Clienti</span>
            </a>
            <a href="#" class="nav-item" data-page="dipendenti">
                <span class="nav-icon">&#9881;</span>
                <span class="nav-label">Dipendenti</span>
            </a>
            <a href="#" class="nav-item" data-page="pianificazione">
                <span class="nav-icon">&#9776;</span>
                <span class="nav-label">Pianificazione</span>
            </a>
            <a href="#" class="nav-item" data-page="preventivi">
                <span class="nav-icon">&#9998;</span>
                <span class="nav-label">Preventivi</span>
            </a>
            <a href="#" class="nav-item" data-page="fatturazione">
                <span class="nav-icon">&#8364;</span>
                <span class="nav-label">Fatturazione</span>
            </a>
            <a href="#" class="nav-item" data-page="magazzino">
                <span class="nav-icon">&#9874;</span>
                <span class="nav-label">Magazzino</span>
            </a>
            <a href="#" class="nav-item" data-page="report">
                <span class="nav-icon">&#9670;</span>
                <span class="nav-label">Report</span>
            </a>
            <a href="#" class="nav-item" data-page="utenti" style="display:none;">
                <span class="nav-icon">&#9906;</span>
                <span class="nav-label">Utenti</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="sidebar-user-info">
                <span class="sidebar-user-name" id="userDisplayName"></span>
                <span class="sidebar-user-role" id="userDisplayRole"></span>
            </div>
        </div>
    </aside>

    <!-- Overlay mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main Content -->
    <main class="main-content">
        <header class="topbar">
            <button class="menu-toggle" id="menuToggle" aria-label="Apri menu">&#9776;</button>
            <h1 class="page-title" id="pageTitle">Dashboard</h1>
            <div class="topbar-actions">
                <span class="current-date" id="currentDate"></span>
                <button class="btn btn-sm btn-outline" onclick="Auth.openChangePassword()" title="Cambia password">&#9881; Profilo</button>
                <button class="btn btn-sm btn-danger" onclick="Auth.logout()" title="Esci">Esci</button>
            </div>
        </header>
        <div class="content-area" id="contentArea">
            <!-- Il contenuto dinamico viene caricato qui -->
        </div>
    </main>

    </div><!-- /appShell -->

    <!-- Modal generico -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle"></h2>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer" id="modalFooter"></div>
        </div>
    </div>

    <!-- Toast notifiche -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/clienti.js"></script>
    <script src="js/dipendenti.js"></script>
    <script src="js/pianificazione.js"></script>
    <script src="js/preventivi.js"></script>
    <script src="js/fatturazione.js"></script>
    <script src="js/magazzino.js"></script>
    <script src="js/report.js"></script>
</body>
</html>
